name: ML CI/CD Pipeline
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas==2.1.4 numpy==1.26.2 scikit-learn==1.3.2 joblib==1.3.2 pytest==8.3.5
      - run: python -m pytest tests/ -v
  train-evaluate-deploy:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas==2.1.4 numpy==1.26.2 scikit-learn==1.3.2 joblib==1.3.2
      - run: python run_pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: trained-production-model
          path: production_model/
